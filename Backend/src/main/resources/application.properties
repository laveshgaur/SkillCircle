# ============================
# SkillCircle Application Config
# ============================
# All values are loaded from .env file via spring.config.import.
# See .env.example for required variables.
# ============================

spring.application.name=SkillCircle
spring.config.import=optional:file:.env[.properties]

# ---- Server ----
server.port=${SERVER_PORT}

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY}

# ---- OAuth2 — GitHub ----
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ---- OAuth2 — Google ----
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS}

# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- AI / Embedding ----
app.openai.api-key=${OPENAI_API_KEY}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL}
app.openai.embedding-dimensions=${OPENAI_EMBEDDING_DIMS}

# ---- AI / Chat (LLM) ----
app.ai.chat-model=${AI_CHAT_MODEL}
app.ai.max-tokens=${AI_MAX_TOKENS}

# ---- Qdrant (Vector DB) ----
app.qdrant.url=${QDRANT_URL}
app.qdrant.collection=${QDRANT_COLLECTION}

# ---- Matching Engine Weights ----
app.matching.weight.semantic=${MATCH_WEIGHT_SEMANTIC}
app.matching.weight.collab=${MATCH_WEIGHT_COLLAB}
app.matching.weight.goal=${MATCH_WEIGHT_GOAL}
app.matching.top-k=${MATCH_TOP_K}
app.matching.timezone-overlap-hours=${MATCH_TZ_OVERLAP}

# ---- Logging ----
logging.level.com.skillcircle=${LOG_LEVEL_APP}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY}
