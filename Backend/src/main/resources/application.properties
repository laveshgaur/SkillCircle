# ============================
# SkillCircle Application Config
# ============================
spring.application.name=SkillCircle
server.port=${SERVER_PORT:8080}

# ============================
# PostgreSQL
# ============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillcircle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================
# Redis
# ============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ============================
# JWT Configuration
# ============================
app.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_ENV_FILE_USE_256_BIT_KEY_OR_LONGER}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY:604800000}

# ============================
# OAuth2 — GitHub
# ============================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ============================
# OAuth2 — Google
# ============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ============================
# CORS
# ============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ============================
# OpenAPI / Swagger
# ============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================
# AI / Embedding
# ============================
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.openai.embedding-dimensions=${OPENAI_EMBEDDING_DIMS:1536}

# ============================
# Qdrant (Vector DB)
# ============================
app.qdrant.url=${QDRANT_URL:http://localhost:6333}
app.qdrant.collection=${QDRANT_COLLECTION:skillcircle_profiles}

# ============================
# Matching Engine Weights
# ============================
app.matching.weight.semantic=${MATCH_WEIGHT_SEMANTIC:0.5}
app.matching.weight.collab=${MATCH_WEIGHT_COLLAB:0.3}
app.matching.weight.goal=${MATCH_WEIGHT_GOAL:0.2}
app.matching.top-k=${MATCH_TOP_K:50}
app.matching.timezone-overlap-hours=${MATCH_TZ_OVERLAP:4}

# ============================
# Logging
# ============================
logging.level.com.skillcircle=DEBUG
logging.level.org.springframework.security=DEBUG
